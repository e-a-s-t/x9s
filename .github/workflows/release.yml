name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate release source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Devbox
        uses: jetify-com/devbox-install-action@v0.12.0

      - name: Verify tag matches Cargo version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="$(devbox run -- cargo metadata --no-deps --format-version 1 | jq -er '.packages[] | select(.name == "x9s") | .version')"
          test "$RELEASE_TAG" = "v$version"

      - name: Check formatting
        run: devbox run -- cargo fmt --all -- --check

      - name: Run Clippy
        run: devbox run -- cargo clippy --workspace --all-targets -- -D warnings

      - name: Run tests
        run: devbox run -- cargo test --workspace

  build:
    name: Build ${{ matrix.archive }}
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            archive: x9s-darwin-arm64.tar.gz
          - os: macos-15-intel
            target: x86_64-apple-darwin
            archive: x9s-darwin-amd64.tar.gz
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: x9s-linux-amd64.tar.gz
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive: x9s-linux-arm64.tar.gz

    steps:
      - uses: actions/checkout@v4

      - name: Install Devbox
        uses: jetify-com/devbox-install-action@v0.12.0

      - name: Build release binary
        run: devbox run -- cargo build --locked --release --target ${{ matrix.target }}

      - name: Package archive
        shell: bash
        run: |
          set -euo pipefail
          checksum_for() {
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$1" | awk '{print $1}'
            else
              shasum -a 256 "$1" | awk '{print $1}'
            fi
          }
          stage="$(mktemp -d)"
          cp "target/${{ matrix.target }}/release/x9s" "$stage/x9s"
          tar -czf "${{ matrix.archive }}" -C "$stage" x9s
          checksum="$(checksum_for "${{ matrix.archive }}")"
          printf '%s  %s\n' "$checksum" "${{ matrix.archive }}" > "${{ matrix.archive }}.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: |
            ${{ matrix.archive }}
            ${{ matrix.archive }}.sha256
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs:
      - validate
      - build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: x9s-*.tar.gz
          path: release-assets
          merge-multiple: true

      - name: Verify assets and create checksums
        working-directory: release-assets
        run: |
          set -euo pipefail
          checksum_for() {
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$1" | awk '{print $1}'
            else
              shasum -a 256 "$1" | awk '{print $1}'
            fi
          }
          test "$(find . -maxdepth 1 -name 'x9s-*.tar.gz' -type f | wc -l | tr -d ' ')" = 4
          for archive in x9s-*.tar.gz; do
            checksum="$(checksum_for "$archive")"
            printf '%s  %s\n' "$checksum" "$archive"
          done > SHA256SUMS

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            release-assets/x9s-*.tar.gz \
            release-assets/SHA256SUMS \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
