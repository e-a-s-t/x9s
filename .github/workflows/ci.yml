name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Devbox
        uses: jetify-com/devbox-install-action@v0.12.0

      - name: Check formatting
        run: devbox run -- cargo fmt --all -- --check

      - name: Run Clippy
        run: devbox run -- cargo clippy --workspace --all-targets -- -D warnings

      - name: Run tests
        run: devbox run -- cargo test --workspace
